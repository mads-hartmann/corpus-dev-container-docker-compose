tasks:
  buildImages:
    name: Build images
    description: Build the Docker Compose images, installing Python dependencies into the web image.
    command: |
      docker compose build
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  check:
    name: Check
    description: Run the project's end-to-end check (build, compile, smoke test the web and redis services).
    command: |
      make check
    triggeredBy:
      - manual
    dependsOn:
      - buildImages

services:
  web:
    name: Web
    description: Flask web service with a Redis-backed hit counter, served via Docker Compose.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --dont-wait --admission creator_only --name "Web"
        docker compose up
      ready: |
        curl -fsS http://localhost:8000/health
      stop: |
        docker compose down
